site_name: Metagenomic Data Analysis of Microbial Communities (MGMC01)
nav:
    - Home: index.md
    - Precourse preparations: precourse.md
    - Course schedule: course_schedule.md
    - Course instructor: instructor.md
    - Course material:
      - Day 1 - Introduction and quality control: course_material/day1_introduction_quality_control.md
      - Day 2 - Targeted sequencing analysis: course_material/day2_targeted_amplification_analysis.md
      - Day 3 - Shotgun metagenomics and downstream analysis: course_material/day3_reference_based_compositional_analysis.md
      - Day 4 - Pipeline selection, MAG quality and annotation: course_material/day4_mag_annotation.md

theme:
  name: material
  logo: assets/images/SIB_logo.svg
  favicon: assets/images/SIB_logo.svg
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
    admonition:
      catalog: octicons/thumbsup-16
      courses: octicons/book-16
      terminal: octicons/terminal-16
      full-code: material/code-block-braces
      learning: octicons/mortar-board-16
      people: octicons/people-16
      licensing: octicons/law-16
      videos: octicons/video-16
      question: octicons/question-16
  features:
    - announce.dismiss
    - content.code.copy
    - navigation.top
    - navigation.footer

extra:
  version:
    provider: mike
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our training material and whether users
      find what they're searching for. With your consent, you're helping us to
      make our training material better.
    cookies:
      matomo: Matomo Analytics

copyright: >
  Copyright &copy; 2021-2026 SIB Swiss Institute of Bioinformatics -
  <a href="#__consent">Change cookie settings</a>

# Repository (update once the repository is created)
repo_name: jeffe107/metagenomics-training
repo_url: https://github.com/jeffe107/metagenomics-training

markdown_extensions:
  - abbr
  - def_list
  - footnotes
  - tables
  - admonition
  - codehilite:
      guess_lang: false
  - sane_lists
  - smarty
  - toc
  - pymdownx.superfences
  - md_in_html
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/consent.js